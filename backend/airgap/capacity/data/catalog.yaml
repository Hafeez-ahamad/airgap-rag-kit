# AirGap model catalogue. Single source of truth for the planner, installer, CLI and
# Compatibility Lab. Change it only with a review; bump catalog_version on every change.
#
# Provenance rules (REQUIREMENTS rule 2 and 4):
# - architecture: copied from the model's official config.json (source + date recorded).
# - download_bytes: from the runtime's registry listing (rounded by the registry; recorded as
#   such) or measured from a local artifact (exact).
# - resident estimates are DERIVED by the planner (weights + KV + runtime overhead). Nothing in
#   this file is a measured RAM/VRAM requirement unless a `measured` block says so.
# - quality_rank stays null until eval/model_bakeoff.py has measured it.

schema_version: 1
catalog_version: "2026.10.29-2"

runtimes:
  ollama:
    display_name: Ollama
    licence: MIT
    tested_versions: ["0.40.12"]
    min_version: "0.40.0"
    platforms: [windows/amd64, windows/arm64, linux/amd64, linux/arm64, darwin/arm64]
    accelerators: [cpu, cuda, metal]   # ROCm exists upstream but is untested here
    # Estimates, not measurements. Replace with bench/ results per runtime and GPU.
    host_overhead_bytes: 536870912     # 0.5 GiB: runner process, buffers, mmap bookkeeping
    gpu_overhead_bytes: 671088640      # 0.625 GiB: CUDA/Metal context + compute buffers
    kv_bytes_per_element: {f16: 2, q8_0: 1, q4_0: 0.5}
    install_url: https://ollama.com/download

