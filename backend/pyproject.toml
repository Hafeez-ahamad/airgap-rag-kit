[project]
name = "airgap-rag-kit"
version = "0.1.0.dev0"
description = "Self-sizing, air-gapped document assistant"
license = "Apache-2.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "redis>=5.0",
    "qdrant-client==1.20.0",
    "httpx>=0.27",
    "pypdfium2>=4.30",
    "pillow>=10.4",
    "python-docx>=1.1",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
# Installed only into the embedding/reranker service image.
models = [
    "sentence-transformers>=3.0",
    "torch>=2.4",
]

[project.scripts]
airgap = "airgap.cli.main:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "mypy>=1.11",
    "ruff>=0.6",
    "types-openpyxl",
]

# CPU-only torch for the model-service image (Phase 1 dev). A CUDA variant is added in Phase 2.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["airgap"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "N", "PTH", "TID"]
ignore = ["S101", "N818"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S108"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
packages = ["airgap", "tests"]

[[tool.mypy.overrides]]
module = ["docx.*", "pypdfium2.*", "sentence_transformers.*", "torch.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -m 'not gpu and not model and not docker and not slow'"
markers = [
    "gpu: needs an NVIDIA GPU",
    "model: needs real model weights on disk",
    "docker: needs a running Docker daemon / compose stack",
    "slow: long-running test",
]
filterwarnings = ["error::DeprecationWarning:airgap.*"]
