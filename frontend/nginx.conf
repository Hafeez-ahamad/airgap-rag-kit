# Reverse proxy: TLS termination, request limits, static UI, /api -> api:8000.
# TLS cert/key come from compose secrets (self-signed by default, or the organisation's own).
worker_processes auto;
pid /tmp/nginx.pid;
events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  server_tokens off;
  sendfile on;
  access_log /dev/stdout;
  error_log  /dev/stderr warn;

  client_body_temp_path /tmp/client_body;
  proxy_temp_path       /tmp/proxy;
  fastcgi_temp_path     /tmp/fastcgi;
  uwsgi_temp_path       /tmp/uwsgi;
  scgi_temp_path        /tmp/scgi;

  # Upload limit: per request (many files). Per-file limits are enforced by the API.
  client_max_body_size 200m;
  client_body_timeout 120s;

  limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;

  server {
    listen 8443 ssl;
    http2 on;
    ssl_certificate     /run/secrets/tls_cert;
    ssl_certificate_key /run/secrets/tls_key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header Content-Security-Policy "default-src 'self'; img-src 'self' blob: data:; frame-src 'self' blob:; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    root /usr/share/nginx/html;

    location = /healthz { access_log off; return 200 "ok\n"; }

    location /api/chat {
      limit_req zone=api burst=20 nodelay;
      proxy_pass http://api:8000/chat;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_buffering off;          # stream SSE tokens immediately
      proxy_read_timeout 600s;
    }

    location /api/ {
      limit_req zone=api burst=40 nodelay;
      proxy_pass http://api:8000/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_read_timeout 300s;
    }

    location / {
      try_files $uri /index.html;
    }
  }
}
